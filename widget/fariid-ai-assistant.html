    img.onerror = function () {
      if (img.classList.contains('fri-launch-logo')) { root.classList.add('no-logo'); img.remove(); return; }
      var s = document.createElement('span'); s.textContent = NAME.charAt(0); s.style.cssText = 'font:700 14px Inter,sans-serif;color:#058F83'; img.replaceWith(s);
    };
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function scroll() { body.scrollTop = body.scrollHeight; }
  function setReady(on) { input.disabled = !on; send.disabled = !on || busy; if (on && !panel.hidden) input.focus(); }
  function ago(t) {
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 45) return 'Just now';
    var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  setInterval(function () { [].forEach.call(body.querySelectorAll('[data-t]'), function (n) { n.textContent = ago(Number(n.getAttribute('data-t'))); }); }, 30000);

  // One chat row: "avatar  Name · time" on one line, then the bubble with its tail pointing at the avatar.
  function row(who, bubbleContent, extraCls) {
    var r = el('div', 'fri-row fri-' + who + (extraCls ? ' ' + extraCls : ''));
    var meta = el('div', 'fri-meta');
    var av = el('div', 'fri-av');
    if (who === 'bot') { var img = el('img'); img.width = 28; img.height = 28; img.alt = ''; setAvatar(img); av.appendChild(img); }
    else { av.innerHTML = USER_ICON; av.setAttribute('aria-hidden', 'true'); }
    meta.appendChild(av);
    meta.appendChild(el('b', null, who === 'bot' ? NAME : 'You'));
    meta.appendChild(document.createTextNode('·'));
    var time = el('span', null, 'Just now'); time.setAttribute('data-t', String(Date.now())); meta.appendChild(time);
    var bub = el('div', 'fri-bub');
    if (typeof bubbleContent === 'string') bub.appendChild(el('p', null, bubbleContent)); else bub.appendChild(bubbleContent);
    r.appendChild(meta); r.appendChild(bub);
    body.appendChild(r); scroll();
    return r;
  }

  // Answer text → safe DOM: paragraphs, lists, [n] citations and source pills.
  function answerContent(text, sources) {
    var frag = document.createDocumentFragment();
    var byN = {}; (sources || []).forEach(function (s) { byN[s.n] = s; });
    var list = null, para = [];
    function flush() { if (para.length) { var p = el('p'); inline(p, para.join(' '), byN); frag.appendChild(p); para = []; } }
    String(text).split('\n').forEach(function (line) {
      var t = line.trim(), item = t.match(/^(\d+[.)]|[-*•])\s+(.*)$/);
      if (!t) { flush(); list = null; return; }
      if (item) {
        flush();
        var ordered = /^\d/.test(item[1]);
        if (!list || (list.tagName === 'OL') !== ordered) { list = el(ordered ? 'ol' : 'ul'); frag.appendChild(list); }
        var li = el('li'); inline(li, item[2], byN); list.appendChild(li);
      } else { list = null; para.push(t); }
    });
    flush();
    if (sources && sources.length) {
      var src = el('div', 'fri-sources');
      sources.forEach(function (s) {
        var a = el('a'); a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; a.title = s.title;
        a.innerHTML = LINK_ICON; a.appendChild(document.createTextNode(s.title));
        src.appendChild(a);
      });
      frag.appendChild(src);
    }
    return frag;
  }
  function inline(parent, text, byN) {
    text.replace(/\*\*(.+?)\*\*/g, '$1').split(/(\[\d+\])/).forEach(function (part) {
      var m = part.match(/^\[(\d+)\]$/);
      if (m && byN[m[1]]) {
        var sup = el('sup'), a = el('a', null, m[1]);
        a.href = byN[m[1]].url; a.target = '_blank'; a.rel = 'noopener'; a.title = byN[m[1]].title;
        sup.appendChild(a); parent.appendChild(sup);
      } else if (!m) parent.appendChild(document.createTextNode(part));
    });
  }
  function showError(msg) { row('bot', msg, 'fri-err'); }

  function welcome() {
    if (started) return; started = true;
    row('bot', "Hi! 👋 I'm " + NAME + ", Ahmed MC's AI assistant. I can help with questions about Ahmed, his free tools, and how to find your way around this website.");
    var chips = el('div', 'fri-chips'); chips.id = 'faChips';
    CHIPS.forEach(function (c) { var b = el('button', null, c[0] + ' ' + c[1]); b.type = 'button'; b.setAttribute('data-q', c[1]); chips.appendChild(b); });
    body.appendChild(chips);
  }

  // Turnstile → 30-minute session.
  function loadTurnstile(cb) {
    if (window.turnstile) return cb();
    if (scriptLoaded) return setTimeout(function () { loadTurnstile(cb); }, 200);
    scriptLoaded = true;
    var s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true; s.onload = cb;
    s.onerror = function () { $('faVerifyMsg').textContent = 'The human check could not load. Please refresh the page.'; };
    document.head.appendChild(s);
  }
  function verify() {
    $('faVerify').classList.remove('is-done');
    $('faVerifyMsg').textContent = "Quick check that you're human…";
    setReady(false);
    loadTurnstile(function () {
      if (widgetId !== null) { try { window.turnstile.remove(widgetId); } catch (e) {} }
      widgetId = window.turnstile.render('#faTurnstile', {
        sitekey: cfg.siteKey, action: 'fariid_ai_assistant', size: 'flexible',
        callback: function (token) {
          fetch(cfg.apiUrl + '/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) })
            .then(function (r) { return r.json().catch(function () { return { error: 'not_json' }; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
            .then(function (r) {
              if (r.d && r.d.error === 'region_unavailable') {
                $('faVerifyMsg').textContent = "Sorry, the AI assistant isn't available in your region yet. You can still browse the site or use the contact page.";
                return;
              }
              if (!r.ok || !r.d.session) {
                var code = ((r.d && r.d.error) || ('http_' + r.status)) + (r.d && r.d.reason ? ': ' + r.d.reason : '');
                console.warn('Fariid: session failed', r.status, code);
                $('faVerifyMsg').textContent = 'Verification failed (' + code + '). Close and reopen to try again.';
                return;
              }
              session = r.d.session;
              $('faVerify').classList.add('is-done');
              setReady(true);
            })
            .catch(function (e) {
              console.warn('Fariid: could not reach the assistant server', e);
              $('faVerifyMsg').textContent = 'Verification failed (cannot_reach_server). Close and reopen to try again.';
            });
        },
        'error-callback': function () { $('faVerifyMsg').textContent = 'Verification failed. Close and reopen to try again.'; }
      });
    });
  }

  function ask(question) {
    question = String(question || '').trim();
    if (!question || busy) return;
    if (!session) { verify(); return; }
    var chips = $('faChips'); if (chips) chips.remove();
    row('user', question);
    var t = el('span', 'fri-typing'); t.innerHTML = '<i></i><i></i><i></i>';
    var typing = row('bot', t); typing.querySelector('.fri-meta').lastChild.textContent = 'typing…';
    busy = true; setReady(true); input.value = ''; autosize();

    fetch(cfg.apiUrl + '/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session },
      body: JSON.stringify({ question: question, history: history.slice(-4) })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (r) {
        typing.remove();
        if (r.status === 200 && r.d.answer) {
          row('bot', answerContent(r.d.answer, r.d.sources));
          history.push({ role: 'user', content: question }, { role: 'assistant', content: r.d.answer });
        } else if (r.status === 401) {
          session = null; showError('Your session expired. Please complete the quick check again.'); verify();
        } else if (r.status === 503 && r.d.error === 'busy') {
          showError("I'm a bit busy right now. Please try again in a minute.");
        } else if (r.status === 451) {
          showError("Sorry, the AI assistant isn't available in your region yet. You can still use the contact page.");
        } else if (r.status === 429) {
          showError("You've reached today's question limit. Please come back tomorrow, or use the contact page.");
        } else {
          if (r.d && r.d.reason) console.warn('Fariid: assistant error', r.status, r.d.reason);
          showError('Sorry, I’m unavailable right now. Please try again later.' + (r.d && r.d.reason ? ' (' + r.d.reason + ')' : ''));
        }
      })
      .catch(function () { typing.remove(); showError('Connection problem. Please check your internet and try again.'); })
      .then(function () { busy = false; setReady(!!session); });
  }

  function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; }

  // Pop-up greeting: shows shortly after each page loads, until the visitor closes it or opens the chat
  // (then it stays hidden for the rest of their visit).
  var nudge = $('faNudge'), nudgeTimer;
  function seen() { try { return sessionStorage.getItem('fariidNudgeDone') === '1'; } catch (e) { return false; } }
  function markSeen() { try { sessionStorage.setItem('fariidNudgeDone', '1'); } catch (e) {} }
  function hideNudge(done) { nudge.hidden = true; clearTimeout(nudgeTimer); if (done) markSeen(); }
  $('faNudgeText').textContent = cfg.greeting || ("👋 Hi! I'm " + NAME + '. Ask me anything.');
  if (!seen()) {
    setTimeout(function () {
      if (!panel.hidden) return;
      nudge.hidden = false;
      nudgeTimer = setTimeout(function () { hideNudge(false); }, 15000);
    }, 1500);
  }
  $('faNudgeX').addEventListener('click', function (e) { e.stopPropagation(); hideNudge(true); });
  nudge.addEventListener('click', function () { hideNudge(true); open(); });

  function open() {
    hideNudge(true);
    root.classList.add('is-open'); panel.hidden = false;
    $('faLaunch').setAttribute('aria-expanded', 'true'); $('faLaunch').setAttribute('aria-label', 'Close chat');
    welcome();
    if (!session) verify(); else input.focus();
  }
  function close() {
    root.classList.remove('is-open'); panel.hidden = true;
    $('faLaunch').setAttribute('aria-expanded', 'false'); $('faLaunch').setAttribute('aria-label', 'Chat with ' + NAME);
    $('faLaunch').focus();
  }

  $('faLaunch').addEventListener('click', function () { panel.hidden ? open() : close(); });
  $('faClose').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) close(); });
  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
  input.addEventListener('input', autosize);
  body.addEventListener('click', function (e) {
    var chip = e.target.closest('.fri-chips button');
    if (!chip) return;
    if (session) ask(chip.getAttribute('data-q')); else { input.value = chip.getAttribute('data-q'); }
  });
})();
</script>
